server {
    listen 80;
    server_name 167-86-125-229.nip.io;

    # let Certbot do its HTTP-01 challenge before redirecting everything to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name 167-86-125-229.nip.io;

    # certbot --nginx will populate these
    ssl_certificate     /etc/letsencrypt/live/167-86-125-229.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/167-86-125-229.nip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 64k;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Friendly root response so people poking the URL see something.
    location = / {
        return 200 'Saudia Service API\n';
        add_header Content-Type text/plain;
    }

    # Hide nginx 404 internals; just say so plainly.
    error_page 404 = @notfound;
    location @notfound {
        return 404 'Not found\n';
        add_header Content-Type text/plain;
    }
}
