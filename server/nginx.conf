server {
    listen 80;
    server_name saudihizmat.fyi www.saudihizmat.fyi;

    # let Certbot do its HTTP-01 challenge before we redirect to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://saudihizmat.fyi$request_uri;
    }
}

# Redirect www to apex on HTTPS
server {
    listen 443 ssl http2;
    server_name www.saudihizmat.fyi;

    ssl_certificate     /etc/letsencrypt/live/saudihizmat.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saudihizmat.fyi/privkey.pem;

    return 301 https://saudihizmat.fyi$request_uri;
}

# Main app — static frontend + /api proxy
server {
    listen 443 ssl http2;
    server_name saudihizmat.fyi;

    ssl_certificate     /etc/letsencrypt/live/saudihizmat.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saudihizmat.fyi/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 64k;
    root /opt/saudia-service;

    # Hide repo internals
    location ~ /\. { deny all; return 404; }
    location ^~ /server/ { deny all; return 404; }
    location = /content.json           { deny all; return 404; }
    location = /build.py               { deny all; return 404; }
    location = /saudia-service.html    { deny all; return 404; }
    location = /.gitignore             { deny all; return 404; }

    # Backend API (FastAPI on localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static assets — cacheable
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # SPA root + everything else (try file, fall back to index.html)
    # No browser cache for HTML / JS / CSS so updates appear immediately.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
